name: CI

# Verification only: builds and tests every push to main and every PR.
# Nothing here publishes or releases artifacts.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      # "**" also matches base branches containing "/", so stacked PRs are verified too.
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; every main push keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dhttp.keepAlive=false

jobs:
  Get-CI-Image-Tag:
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@main
    with:
      product: opensearch

  build:
    name: Build
    needs: ["Get-CI-Image-Tag"]
    strategy:
      fail-fast: false
      matrix:
        jdk: [25]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    container:
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}
    
    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}
      
      - name: Set up JDK for build and test
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      
      - name: Checkout opensearch-storage-encryption
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
        with:
          cache-disabled: true
          arguments: |
            assemble -Dbuild.snapshot=false
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-artifacts-jdk${{ matrix.jdk }}
          path: |
            ./build/
            ./gradle/
            ./gradlew
            ./gradlew.bat
            ./settings.gradle
            ./build.gradle

  unit-tests:
    name: Unit Tests
    needs: ["Get-CI-Image-Tag", "build"]
    strategy:
      fail-fast: false
      matrix:
        jdk: [25]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    container:
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}
    
    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}
      
      - name: Set up JDK for build and test
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      
      - name: Checkout opensearch-storage-encryption
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-artifacts-jdk${{ matrix.jdk }}
      
      - name: Switch to ci-runner user and Run Unit tests
        run: |
          chown -R ci-runner:ci-runner $GITHUB_WORKSPACE
          find $GITHUB_WORKSPACE -type d -exec chmod 755 {} \;
          find $GITHUB_WORKSPACE -type f -exec chmod 644 {} \;
          chmod +x $GITHUB_WORKSPACE/gradlew
          su ci-runner -c "export JAVA_HOME=$JAVA_HOME && export GRADLE_OPTS='$GRADLE_OPTS' && cd $GITHUB_WORKSPACE && ./gradlew check -x internalClusterTest -x yamlRestTest -Dbuild.snapshot=false"

      - name: Upload test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-test-reports-jdk${{ matrix.jdk }}
          path: |
            ./build/reports/

  integ-tests:
    name: Integration Tests
    needs: ["Get-CI-Image-Tag", "build", "unit-tests"]
    strategy:
      fail-fast: false
      matrix:
        jdk: [25]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    container:
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}
    
    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}
      
      - name: Set up JDK for build and test
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      
      - name: Checkout opensearch-storage-encryption
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-artifacts-jdk${{ matrix.jdk }}
      
      - name: Switch to ci-runner user and Run Internal Cluster tests
        run: |
          chown -R ci-runner:ci-runner $GITHUB_WORKSPACE
          find $GITHUB_WORKSPACE -type d -exec chmod 755 {} \;
          find $GITHUB_WORKSPACE -type f -exec chmod 644 {} \;
          chmod +x $GITHUB_WORKSPACE/gradlew
          su ci-runner -c "export JAVA_HOME=$JAVA_HOME && export GRADLE_OPTS='$GRADLE_OPTS' && cd $GITHUB_WORKSPACE && ./gradlew internalClusterTest -Dbuild.snapshot=false"

      - name: Upload test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integ-test-reports-jdk${{ matrix.jdk }}
          path: |
            ./build/reports/

  yaml-rest-tests:
    name: YAML REST Tests
    needs: ["Get-CI-Image-Tag", "build", "integ-tests"]
    strategy:
      fail-fast: false
      matrix:
        jdk: [25]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    container:
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}
    
    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}
      
      - name: Set up JDK for build and test
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      
      - name: Checkout opensearch-storage-encryption
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-artifacts-jdk${{ matrix.jdk }}
      
      - name: Switch to ci-runner user and Run YAML REST tests
        run: |
          chown -R ci-runner:ci-runner $GITHUB_WORKSPACE
          find $GITHUB_WORKSPACE -type d -exec chmod 755 {} \;
          find $GITHUB_WORKSPACE -type f -exec chmod 644 {} \;
          chmod +x $GITHUB_WORKSPACE/gradlew
          su ci-runner -c "export JAVA_HOME=$JAVA_HOME && export GRADLE_OPTS='$GRADLE_OPTS' && cd $GITHUB_WORKSPACE && ./gradlew yamlRestTest -Dbuild.snapshot=false"

      - name: Upload test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: yaml-rest-test-reports-jdk${{ matrix.jdk }}
          path: |
            ./build/reports/

  aws-lc-fips:
    name: Build AWS-LC FIPS (${{ matrix.platform }})
    # The FIPS build bundles the AWS-LC FIPS 3.0.0 module. It is built on RHEL 8's glibc (2.28) so the library
    # loads on every Linux distribution OpenSearch supports.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # dnf on the arm runner can take over half an hour on slow mirror days.
    timeout-minutes: 75
    permissions:
      contents: read
    container: almalinux:8
    steps:
      - name: Install build tools
        run: |
          dnf -y --enablerepo=powertools install epel-release
          dnf -y --enablerepo=powertools install git cmake ninja-build golang perl gcc gcc-c++ binutils patchelf
          gcc --version | head -1; go version; cmake --version | head -1

      - name: Checkout opensearch-storage-encryption
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build AWS-LC FIPS
        run: scripts/build-aws-lc-fips.sh "$PWD/aws-lc-fips/libawslc-fips-crypto.so" "$RUNNER_TEMP/aws-lc-work"

      - name: Check the glibc it needs and its SONAME
        run: |
          readelf -d aws-lc-fips/libawslc-fips-crypto.so | grep -q 'Library soname: \[libawslc-fips-crypto.so\]'
          newest=$(objdump -T aws-lc-fips/libawslc-fips-crypto.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol version: $newest"
          [ "$(printf '%s\nGLIBC_2.28\n' "$newest" | sort -V | tail -1)" = "GLIBC_2.28" ]

      - name: Upload library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aws-lc-fips-${{ matrix.platform }}
          path: aws-lc-fips/libawslc-fips-crypto.so
          if-no-files-found: error

  fips-tests:
    name: FIPS 140-3 Tests
    # Builds with -Pcrypto.standard=FIPS-140-3 and runs every test suite with Bouncy Castle FIPS in
    # approved-only mode (the YAML REST cluster runs with OPENSEARCH_FIPS_MODE=true).
    needs: ["Get-CI-Image-Tag", "build", "aws-lc-fips"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    container:
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}

    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}

      # Must be an OpenJDK build: Oracle JDK's JCE provider signature check cannot run with only FIPS providers.
      - name: Set up JDK for build and test
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Checkout opensearch-storage-encryption
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download AWS-LC FIPS (x86_64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aws-lc-fips-linux-x86_64
          path: aws-lc-fips/linux-x86_64

      - name: Download AWS-LC FIPS (aarch64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aws-lc-fips-linux-aarch64
          path: aws-lc-fips/linux-aarch64

      - name: Switch to ci-runner user and run tests in FIPS mode
        run: |
          chown -R ci-runner:ci-runner $GITHUB_WORKSPACE
          chmod +x $GITHUB_WORKSPACE/gradlew
          su ci-runner -c "export JAVA_HOME=$JAVA_HOME && export GRADLE_OPTS='$GRADLE_OPTS' && cd $GITHUB_WORKSPACE && ./gradlew test internalClusterTest yamlRestTest -x jcstress -Pcrypto.standard=FIPS-140-3 -Paws_lc.libraries=$GITHUB_WORKSPACE/aws-lc-fips -Dbuild.snapshot=false"

      - name: Check the FIPS zip bundles AWS-LC for both architectures
        run: |
          "$JAVA_HOME/bin/jar" tf build/distributions/storage-encryption-fips.zip | tee /dev/stderr | grep -c '^native/linux-.*/libawslc-fips-crypto.so$' | grep -qx 2

      - name: Upload test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fips-test-reports
          path: |
            ./build/reports/
